<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1130" viewBox="0 0 1140 1130">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="570" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="middle">Fig. 4 — AI Model Routing &amp; Cost Control</text>
<rect x="120" y="60" width="560" height="70" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="400" y="90.66000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Request from a feature</text><text x="400" y="109.14000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">task: tutor_chat · ocr · manim_code · simulation · translate · quiz …</text><polygon points="400,156 540,210 400,264 260,210" fill="#FFF4E0" stroke="#C77700" stroke-width="2"/><text x="400" y="205.35" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">Same request</text><text x="400" y="225.15" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">already cached?</text><rect x="755" y="176" width="300" height="68" rx="10" fill="#E3F5F5" stroke="#137C80" stroke-width="2"/><text x="905" y="205.35" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Return cached result</text><text x="905" y="225.15" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">cost = 0</text><rect x="120" y="304" width="560" height="76" rx="10" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="2"/><text x="400" y="337.35" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Look up task in config/models.yaml</text><text x="400" y="357.15000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">primary model · fallback chain · max tokens</text><polygon points="400,406 540,460 400,514 260,460" fill="#FFF4E0" stroke="#C77700" stroke-width="2"/><text x="400" y="455.35" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">Within monthly</text><text x="400" y="475.15000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">budget?</text><rect x="755" y="424" width="300" height="72" rx="10" fill="#FDECEF" stroke="#BE2D4B" stroke-width="2"/><text x="905" y="455.65999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Downgrade to local / free model</text><text x="905" y="474.14" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">or ask you to approve</text><rect x="120" y="560" width="560" height="76" rx="10" fill="#F1EAFD" stroke="#6D3FC0" stroke-width="2"/><text x="400" y="593.35" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Call model via LiteLLM</text><text x="400" y="613.15" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">Ollama · OpenAI · Hugging Face · free tiers</text><polygon points="400,676 540,730 400,784 260,730" fill="#FFF4E0" stroke="#C77700" stroke-width="2"/><text x="400" y="725.35" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">Success and</text><text x="400" y="745.15" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">output valid?</text><rect x="755" y="696" width="300" height="68" rx="10" fill="#FDECEF" stroke="#BE2D4B" stroke-width="2"/><text x="905" y="725.66" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Retry once, then next</text><text x="905" y="744.14" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">model in fallback chain</text><rect x="120" y="830" width="560" height="66" rx="10" fill="#E7F6EC" stroke="#1E8E4E" stroke-width="2"/><text x="400" y="858.35" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Log tokens · cost · latency</text><text x="400" y="878.15" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">visible in Settings → Cost dashboard</text><rect x="120" y="926" width="560" height="60" rx="10" fill="#E3F5F5" stroke="#137C80" stroke-width="2"/><text x="400" y="961.25" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">Save to cache + lesson library</text><rect x="270" y="1020" width="260" height="56" rx="28" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="400" y="1053.25" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle">Return result to feature</text><path d="M400,130 L400,156" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><path d="M540,210 L755,210" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><rect x="601.9" y="198" width="36.2" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="620" y="214.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">Yes</text><path d="M400,264 L400,304" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><rect x="411.6" y="272" width="28.8" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="426" y="288.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">No</text><path d="M400,380 L400,406" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><path d="M540,460 L755,460" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><rect x="605.6" y="448" width="28.8" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="620" y="464.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">No</text><path d="M400,514 L400,560" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><rect x="409.9" y="525" width="36.2" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="428" y="541.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">Yes</text><path d="M905,496 L905,580 L680,580" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><path d="M400,636 L400,676" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><path d="M540,730 L755,730" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><rect x="605.6" y="718" width="28.8" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="620" y="734.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">No</text><path d="M1055,730 L1085,730 L1085,615 L680,615" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><path d="M400,784 L400,830" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><rect x="409.9" y="795" width="36.2" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="428" y="811.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">Yes</text><path d="M400,896 L400,926" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><path d="M400,986 L400,1020" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1055,210 L1115,210 L1115,1048 L530,1048" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><rect x="720" y="830" width="340" height="160" rx="10" fill="#FFF4E0" stroke="#C77700" stroke-width="2" stroke-dasharray="7 5"/><text x="890" y="877.9399999999999" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Cost rules</text><text x="890" y="896.42" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">• local first for simple tasks</text><text x="890" y="914.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">• cheap cloud tier for code &amp; Marathi</text><text x="890" y="933.38" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">• hard monthly cap (in .env)</text><text x="890" y="951.8599999999999" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">• same topic never generated twice</text>
</svg>